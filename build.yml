name: Build APK
run-name: build-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: ID unik build
        required: true
      app_name:
        description: Nama aplikasi
        required: true
      app_url:
        description: URL website
        required: true
      app_id:
        description: Package ID
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Android project
        run: |
          mkdir -p app/src/main/java/com/web2app/template

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          def appName = project.findProperty('appName') ?: 'WebApp'
          def appUrl  = project.findProperty('appUrl')  ?: 'https://example.com'
          def appId   = project.findProperty('appId')   ?: 'com.web2app.generated'

          android {
              namespace 'com.web2app.template'
              compileSdk 34

              defaultConfig {
                  applicationId appId
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  resValue "string", "app_name", appName
                  buildConfigField "String", "APP_URL", "\"${appUrl}\""
              }

              buildFeatures {
                  buildConfig true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/web2app/template/MainActivity.java <<'EOF'
          package com.web2app.template;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import android.widget.ProgressBar;

          public class MainActivity extends Activity {
              private WebView webView;
              private ProgressBar progress;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  FrameLayout root = new FrameLayout(this);
                  webView = new WebView(this);
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setMax(100);
                  root.addView(webView, new FrameLayout.LayoutParams(-1, -1));
                  root.addView(progress, new FrameLayout.LayoutParams(-1, 8));
                  setContentView(root);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          String url = req.getUrl().toString();
                          if (url.startsWith("http://") || url.startsWith("https://")) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                          } catch (Exception ignored) { }
                          return true;
                      }

                      @Override
                      public void onPageStarted(WebView v, String u, Bitmap f) {
                          progress.setVisibility(View.VISIBLE);
                      }

                      @Override
                      public void onPageFinished(WebView v, String u) {
                          progress.setVisibility(View.GONE);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int p) {
                          progress.setProgress(p);
                      }
                  });

                  webView.loadUrl(BuildConfig.APP_URL);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build debug APK
        env:
          APP_NAME: ${{ inputs.app_name }}
          APP_URL: ${{ inputs.app_url }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          gradle assembleDebug --no-daemon \
            -PappName="$APP_NAME" \
            -PappUrl="$APP_URL" \
            -PappId="$APP_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
